name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads code — the GITHUB_TOKEN gets no
# write scope, and checkouts never persist credentials into later steps.
permissions:
  contents: read

jobs:
  test:
    name: unit tests (${{ matrix.os }} / node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.18", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # The extension imports isToolCallEventType (a runtime value, not just
      # types) from pi-coding-agent, so the policy tests need it present.
      # Everything is pinned to exact versions — no-latest so a fresh upstream
      # release cannot change CI behavior for unchanged source.
      - name: install dev type deps
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund \
            @earendil-works/pi-coding-agent@0.83.0 @types/node@22.19.19
      - name: policy tests
        run: node test/policy.test.mts
      - name: model-routing tests
        run: node test/model-routing.test.mjs
      - name: pure role-pack tests
        shell: bash
        run: |
          node test/remote-paseo.test.mjs
          node test/reliability.test.mjs
          node test/watchdog.test.mjs
          node test/team-communication.test.mjs
          node test/browser-setup.test.mjs
          node test/installer-contract.test.mjs
          node test/ocr-setup.test.mjs
          node test/ocr-review.test.mjs
          node test/ocr-integrity.test.mjs
          node test/paseo-contract.test.mjs
      - name: syntax checks
        shell: bash
        run: |
          node --check scripts/preflight.mjs
          node --check scripts/model-routing.mjs
          node --check scripts/remote-paseo.mjs
          node --check scripts/reliability.mjs
          node --check scripts/watchdog.mjs
          node --check scripts/team-communication.mjs
          node --check scripts/browser-setup.mjs
          node --check scripts/ocr-review.mjs
          node --check scripts/ocr-setup.mjs
          node --check scripts/team-scripts-path.mjs
          node --check test/fixtures/fake-paseo.mjs
          node --check test/fixtures/fake-ocr.mjs

  # Live remote Paseo checks stay manual (they need two real hosts); this CI
  # only gates the pure tests. Typecheck needs the pi-coding-agent package
  # types, so it fetches the pinned dev deps on the fly.
  typecheck:
    name: tsc (extension)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: "24"
      - name: install dev type deps
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund \
            @earendil-works/pi-coding-agent@0.83.0 @types/node@22.19.19 \
            typescript@6.0.3
      - name: typecheck extension
        run: npx tsc --noEmit -p tsconfig.ci.json
