name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads code — the GITHUB_TOKEN gets no
# write scope, and checkouts never persist credentials into later steps.
permissions:
  contents: read

jobs:
  test:
    name: unit tests (${{ matrix.os }} / node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.18", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # The extension imports isToolCallEventType (a runtime value, not just
      # types) from pi-coding-agent, so the policy tests need it present.
      # `npm ci` installs exactly what package-lock.json pins — a fresh upstream
      # release cannot change CI behavior for unchanged source.
      - name: install dev deps
        run: npm ci --no-audit --no-fund
      # Runs every test/*.test.{mjs,mts} — a new test file is picked up without
      # editing this workflow, so the suite cannot silently lose coverage.
      - name: tests
        run: npm test
      # Globbed, not enumerated: preflight.mjs has no importing test, so a
      # parse error there would otherwise reach users. A new script is covered
      # the moment it lands.
      - name: syntax checks
        shell: bash
        run: |
          for f in scripts/*.mjs test/fixtures/*.mjs; do
            node --check "$f"
          done

  # Live remote Paseo checks stay manual (they need two real hosts); this CI
  # only gates the pure tests. Typecheck needs the pi-coding-agent package
  # types, which come from the same locked devDependencies.
  typecheck:
    name: tsc (extension)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4.4.0
        with:
          node-version: "24"
      - name: install dev deps
        run: npm ci --no-audit --no-fund
      - name: typecheck extension
        run: npm run typecheck
